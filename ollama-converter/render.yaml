services:
  - type: web
    name: ai-converter-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: CONVERTER_PROVIDER
        value: claude
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: ANTHROPIC_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: SUPABASE_URL
        sync: false  # Set this manually — same URL as VITE_SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false  # Set this manually — get from Supabase dashboard > Settings > API
      - key: VOYAGE_API_KEY
        sync: false  # Set this manually — needed for document semantic search
      - key: PORT
        fromService:
          type: web
          name: ai-converter-api
          property: port

